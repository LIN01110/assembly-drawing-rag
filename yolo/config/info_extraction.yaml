  - name: "物体"
    keywords: ["盒体", "物体", "名称"]
  - name: "编号"
    keywords: ["编号", "图号", "件号"]
  - name: "镀涂"
    keywords: ["镀涂", "涂层", "表面处理"]
  - name: "比例"
